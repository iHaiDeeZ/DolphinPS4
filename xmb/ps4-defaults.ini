# Dolphin for PS4 - built-in defaults (/app0/xmb/ps4-defaults.ini), tuned on a base PS4.
# /data/DolphinPS4/ps4.ini, if present, is read after this file and overrides any value; the
# XMB and in-game menu settings (settings.ini) come on top (DolphinNoGUI/PS4Settings.h).

jit_memory=regular
cpu_core=jit
fastmem=on
dual_core=on
sync_gpu=off
sync_gpu_distance=1000000
cpu_clock=auto
cpu_clock_min=50
cpu_thread_core=2
gpu_thread_core=3
audio_thread_core=4
thread_priority=0
accurate_fmadds=off
efb_access=on
shader_cache=on
uniform_upload=subdata
uniform_merge=auto
audio_buffer=100
gpu_cmdbuf_mb=4
fast_disc=on
vertex_upload=ring
show_fps=on
pagetable_fastmem=off
profile=off
screenshots=off
dump=off
diagnostics=off
fifo_batch=on
fifo_defer=off
perfmon=on
vk_thread=on
wii_extension=nunchuk
wii_sideways=off

# Per-game settings live in xmb/game-settings.ini, the game settings center (also fetched from
# GitHub at every start, so tuning reaches every console without a new release).
