Stretch = 引き伸ばし
The game's picture shape on the TV. = テレビに映るゲーム画面の形。
Letterbox Zoom = レターボックスズーム
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = 16:9の映像を帯付きで表示するゲームを16:9のテレビいっぱいに表示します（バイオハザード4）。
Widescreen Hack = ワイドスクリーンハック
Renders a wider view in 4:3 games (may show glitches at the edges). = 4:3のゲームでより広い範囲を表示します（端に乱れが出ることがあります）。
Crop to Aspect Ratio = アスペクト比でトリミング
Crops the picture to the chosen aspect ratio instead of adding black bars. = 黒帯を付ける代わりに、選んだ比率に画面を切り取ります。
Internal Resolution = 内部解像度
Native (480p) = ネイティブ（480p）
