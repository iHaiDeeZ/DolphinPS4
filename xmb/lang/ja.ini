Frame Rate Limit = フレームレート上限
Unlimited = 無制限
Auto (60/30) = 自動（60/30）
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = 1秒あたりの表示フレーム数を制限します。自動：ゲームが追いつく間は60、追いつかないときは安定した30（上下するフレームレートより滑らかです）。
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = テレビの更新を待ちます（ティアリングなし）。
FPS Counter = FPSカウンター
Frames and emulation speed in the corner. = 隅にフレーム数とエミュレーション速度を表示します。
Texture Filtering = テクスチャフィルタリング
Default = 標準
Smooth (linear) = なめらか（リニア）
Sharp (nearest) = くっきり（ニアレスト）
How textures are smoothed. = テクスチャのなめらかさ。
Anisotropic Filtering = 異方性フィルタリング
Sharper textures at an angle; costs GPU time. = 斜めのテクスチャがくっきりします。GPUを使います。
Anti-Aliasing = アンチエイリアス
Smoother edges; costs GPU time. = 輪郭がなめらかになります。GPUを使います。
Disable Fog = フォグを無効化
Removes distance fog (some games use fog for effects). = 遠くのフォグを消します（効果にフォグを使うゲームもあります）。
Copy Filter = コピーフィルター
The game's own blur/deflicker filter on copies; Off is sharper. = コピーにかかるゲーム自身のぼかし/ちらつき防止フィルター。オフのほうがくっきりします。
EFB Copies = EFBコピー
To Texture (fast) = テクスチャへ（高速）
To RAM (accurate) = RAMへ（正確）
Some effects need RAM copies; Texture is faster. = RAMへのコピーが必要な効果もあります。テクスチャのほうが高速です。
CPU Access to EFB = CPUからのEFBアクセス
Needed by some games (lens flares, cursors); Off is faster. = 一部のゲームで必要です（レンズフレア、カーソル）。オフのほうが高速です。
Manual Texture Sampling = 手動テクスチャサンプリング
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = 正確なテクスチャサンプリング（FIFA Street 2など一部のムービーを修正）。遅くなります。
GPU Texture Decoding = GPUでテクスチャをデコード
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = ゲームのテクスチャを映像スレッドではなくGPUでデコードします（描画の多い場面で有効）。
Shader Compilation = シェーダーのコンパイル
Asynchronous = 非同期
Hybrid Ubershaders = ハイブリッドUbershader
Synchronous = 同期
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = 非同期：カクつきなし。物体が一瞬遅れて表示されることがあります。ハイブリッドUbershader：カクつきも表示漏れもなし。GPUを使います。同期：新しいシェーダーごとに待ちます。
Emulated CPU Clock = エミュレートするCPUクロック
Auto lowers the clock only when the CPU is the limit. = 自動はCPUが限界のときだけクロックを下げます。
Speed Features = 高速化機能
Fast = 高速
Compatible = 互換
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = 互換は、ゲームに不具合やフリーズがあるときに移植版のコマンド処理の近道を無効にします。
Dual Core = デュアルコア
Forced = 強制
Emulates the GPU on its own thread. = GPUを専用のスレッドでエミュレートします。
Vulkan Thread = Vulkanスレッド
Records graphics commands on a separate core. = グラフィックコマンドを別のコアで記録します。
Fast Disc Speed = 高速ディスク
Shorter loading pauses (rarely breaks a game). = 読み込み待ちが短くなります（ゲームが壊れることはまれです）。
