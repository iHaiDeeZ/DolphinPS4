Internal Resolution = 内部分辨率
Native (480p) = 原生（480p）
Sharper pictures at higher settings; costs GPU time. = 设置越高画面越清晰；占用 GPU。
Frame Rate Limit = 帧率上限
Unlimited = 无限制
Auto (60/30) = 自动（60/30）
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = 限制每秒显示的帧数。自动：游戏跟得上时为 60，跟不上时稳定在 30（比忽高忽低的帧率更平稳）。
V-Sync = 垂直同步
Waits for the TV's refresh (no tearing). = 等待电视刷新（无画面撕裂）。
FPS Counter = FPS 计数器
Frames and emulation speed in the corner. = 在角落显示帧数和模拟速度。
Texture Filtering = 纹理过滤
Default = 默认
Smooth (linear) = 平滑（线性）
Sharp (nearest) = 锐利（最近点）
How textures are smoothed. = 纹理的平滑方式。
Anisotropic Filtering = 各向异性过滤
Sharper textures at an angle; costs GPU time. = 倾斜的纹理更清晰；占用 GPU。
Anti-Aliasing = 抗锯齿
Smoother edges; costs GPU time. = 边缘更平滑；占用 GPU。
Disable Fog = 禁用雾效
Removes distance fog (some games use fog for effects). = 去除远处的雾（有些游戏用雾做效果）。
Copy Filter = 复制滤镜
The game's own blur/deflicker filter on copies; Off is sharper. = 游戏自带的复制模糊/防闪烁滤镜；关闭更清晰。
EFB Copies = EFB 复制
To Texture (fast) = 到纹理（快速）
To RAM (accurate) = 到内存（准确）
Some effects need RAM copies; Texture is faster. = 有些效果需要复制到内存；纹理更快。
CPU Access to EFB = CPU 访问 EFB
Needed by some games (lens flares, cursors); Off is faster. = 部分游戏需要（镜头光晕、光标）；关闭更快。
Manual Texture Sampling = 手动纹理采样
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = 精确的纹理采样（修复部分视频，如 FIFA Street 2）；较慢。
GPU Texture Decoding = GPU 纹理解码
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = 在 GPU 而不是视频线程上解码游戏纹理（在绘制繁重的场景中有帮助）。
Shader Compilation = 着色器编译
Asynchronous = 异步
Hybrid Ubershaders = 混合超着色器
Synchronous = 同步
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = 异步：无卡顿，物体可能稍晚出现。混合超着色器：无卡顿也不缺失，占用 GPU。同步：等待每个新着色器。
Emulated CPU Clock = 模拟 CPU 频率
Auto lowers the clock only when the CPU is the limit. = 自动仅在 CPU 成为瓶颈时降低频率。
Speed Features = 加速功能
Fast = 快速
Compatible = 兼容
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = 如果游戏出错或卡死，兼容模式会关闭移植版在命令流上的捷径。
Dual Core = 双核
Forced = 强制
Emulates the GPU on its own thread. = 在单独的线程中模拟 GPU。
Vulkan Thread = Vulkan 线程
Records graphics commands on a separate core. = 在另一个核心上记录图形命令。
Fast Disc Speed = 快速光盘
Shorter loading pauses (rarely breaks a game). = 读取暂停更短（很少导致游戏出错）。
