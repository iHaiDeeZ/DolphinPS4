The game's picture shape on the TV. = 游戏画面在电视上的形状。
Letterbox Zoom = 信箱缩放
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = 让带黑边显示 16:9 画面的游戏铺满 16:9 电视（生化危机 4）。
Widescreen Hack = 宽屏修改
Renders a wider view in 4:3 games (may show glitches at the edges). = 在 4:3 游戏中显示更宽的视野（边缘可能出现错误）。
Crop to Aspect Ratio = 按宽高比裁剪
