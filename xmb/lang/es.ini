Freeze Reports = Informes de bloqueo
Where the emulator was stuck when a game freezes, stalls or starts slowly. = Dónde estaba el emulador cuando un juego se congela, se atasca o tarda en arrancar.
Emulator Log = Registro del emulador
Dolphin's own messages (dolphin.log). = Los mensajes del propio Dolphin (dolphin.log).
Profiler = Perfilador
Records where the time goes (samples.log). Costs speed - only for diagnosing slow games. = Registra en qué se va el tiempo (samples.log). Cuesta velocidad: solo para diagnosticar juegos lentos.
