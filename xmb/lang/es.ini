Diagnostics = Diagnóstico
Aspect Ratio = Relación de aspecto
Auto = Automático
Stretch = Estirar
The game's picture shape on the TV. = La forma de la imagen del juego en la TV.
Letterbox Zoom = Zoom panorámico
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Llena una TV 16:9 con juegos que muestran una imagen 16:9 con bandas (Resident Evil 4).
Widescreen Hack = Hack de pantalla ancha
Renders a wider view in 4:3 games (may show glitches at the edges). = Muestra una vista más amplia en juegos 4:3 (puede haber fallos en los bordes).
Crop to Aspect Ratio = Recortar a la relación de aspecto
Crops the picture to the chosen aspect ratio instead of adding black bars. = Recorta la imagen a la relación elegida en lugar de añadir bandas negras.
Internal Resolution = Resolución interna
Native (480p) = Nativa (480p)
Sharper pictures at higher settings; costs GPU time. = Imagen más nítida con valores altos; consume GPU.
Frame Rate Limit = Límite de fotogramas
Unlimited = Sin límite
Auto (60/30) = Automático (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Limita los fotogramas por segundo. Automático: 60 mientras el juego aguanta, 30 estables cuando no (más fluido que una tasa que sube y baja).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Espera al refresco de la TV (sin cortes en la imagen).
FPS Counter = Contador de FPS
Frames and emulation speed in the corner. = Fotogramas y velocidad de emulación en la esquina.
Texture Filtering = Filtrado de texturas
Default = Predeterminado
Smooth (linear) = Suave (lineal)
Sharp (nearest) = Nítido (más cercano)
How textures are smoothed. = Cómo se suavizan las texturas.
Anisotropic Filtering = Filtrado anisotrópico
Sharper textures at an angle; costs GPU time. = Texturas más nítidas en ángulo; consume GPU.
Anti-Aliasing = Antialiasing
Smoother edges; costs GPU time. = Bordes más suaves; consume GPU.
Disable Fog = Desactivar niebla
Removes distance fog (some games use fog for effects). = Quita la niebla de distancia (algunos juegos la usan para efectos).
Copy Filter = Filtro de copia
The game's own blur/deflicker filter on copies; Off is sharper. = El filtro de desenfoque/parpadeo del propio juego en las copias; No es más nítido.
EFB Copies = Copias EFB
To Texture (fast) = A textura (rápido)
To RAM (accurate) = A RAM (preciso)
Some effects need RAM copies; Texture is faster. = Algunos efectos necesitan copias en RAM; Textura es más rápido.
CPU Access to EFB = Acceso de la CPU al EFB
Needed by some games (lens flares, cursors); Off is faster. = Necesario en algunos juegos (destellos, cursores); No es más rápido.
Manual Texture Sampling = Muestreo manual de texturas
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Muestreo exacto de texturas (arregla algunos vídeos, p. ej. FIFA Street 2); más lento.
GPU Texture Decoding = Decodificar texturas en la GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Decodifica las texturas del juego en la GPU en lugar del hilo de vídeo (ayuda en escenas con muchos dibujos).
Shader Compilation = Compilación de shaders
Asynchronous = Asíncrona
Hybrid Ubershaders = Ubershaders híbridos
Synchronous = Síncrona
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asíncrona: sin tirones, los objetos pueden aparecer con un momento de retraso. Ubershaders híbridos: sin tirones y sin nada ausente, consume GPU. Síncrona: espera a cada shader nuevo.
Emulated CPU Clock = Reloj de CPU emulado
Auto lowers the clock only when the CPU is the limit. = Automático baja el reloj solo cuando la CPU es el límite.
Speed Features = Funciones de velocidad
Fast = Rápido
Compatible = Compatible
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Compatible desactiva los atajos del port en el flujo de comandos si un juego falla o se congela.
Dual Core = Doble núcleo
Forced = Forzado
Emulates the GPU on its own thread. = Emula la GPU en su propio hilo.
Vulkan Thread = Hilo de Vulkan
Records graphics commands on a separate core. = Graba los comandos gráficos en otro núcleo.
Fast Disc Speed = Disco rápido
Shorter loading pauses (rarely breaks a game). = Pausas de carga más cortas (rara vez afecta a un juego).
Performance Graphs = Gráficas de rendimiento
Frame time and speed graphs on screen. = Gráficas de tiempo de fotograma y velocidad en pantalla.
Language = Idioma
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = El idioma de los menús y, si la GameCube o la Wii lo tienen, el de los juegos. El menú se reinicia para cambiarlo.
Game Volume = Volumen del juego
Volume of the games' sound. = Volumen del sonido de los juegos.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = Lo que hay conectado al Wii Remote. Wii Sports y juegos parecidos necesitan Ninguna.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Para juegos que se juegan con el Wii Remote en horizontal (NSMB Wii, Mario Kart Wii).
Audio Buffer = Búfer de audio
Larger is smoother when a game runs below full speed; smaller has less delay. = Más grande suena más fluido si el juego va por debajo de la velocidad completa; más pequeño tiene menos retraso.
All Diagnostics = Todo el diagnóstico
Every switch below at once. Off: nothing is recorded while you play. = Todos los interruptores de abajo a la vez. No: no se registra nada mientras juegas.
Performance Log = Registro de rendimiento
