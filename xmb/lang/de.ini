Graphics = Grafik
Performance = Leistung
System = System
Diagnostics = Diagnose
Aspect Ratio = Seitenverhältnis
Auto = Automatisch
Stretch = Strecken
The game's picture shape on the TV. = Die Bildform des Spiels auf dem Fernseher.
Letterbox Zoom = Letterbox-Zoom
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Füllt einen 16:9-Fernseher bei Spielen, die ein 16:9-Bild mit Balken zeigen (Resident Evil 4).
Widescreen Hack = Breitbild-Hack
Renders a wider view in 4:3 games (may show glitches at the edges). = Zeigt in 4:3-Spielen eine breitere Ansicht (an den Rändern sind Fehler möglich).
Crop to Aspect Ratio = Auf Seitenverhältnis zuschneiden
Crops the picture to the chosen aspect ratio instead of adding black bars. = Schneidet das Bild auf das gewählte Seitenverhältnis zu, statt schwarze Balken einzufügen.
Internal Resolution = Interne Auflösung
Native (480p) = Nativ (480p)
Sharper pictures at higher settings; costs GPU time. = Schärferes Bild bei höheren Werten; kostet GPU-Zeit.
Frame Rate Limit = Bildratenbegrenzung
Unlimited = Unbegrenzt
Auto (60/30) = Automatisch (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Begrenzt die angezeigten Bilder pro Sekunde. Automatisch: 60, solange das Spiel mithält, sonst gleichmäßige 30 (ruhiger als eine schwankende Bildrate).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Wartet auf die Bildwiederholung des Fernsehers (kein Tearing).
FPS Counter = FPS-Anzeige
Frames and emulation speed in the corner. = Bilder und Emulationsgeschwindigkeit in der Ecke.
Texture Filtering = Texturfilterung
Default = Standard
Smooth (linear) = Weich (linear)
Sharp (nearest) = Scharf (nächster Punkt)
How textures are smoothed. = Wie Texturen geglättet werden.
Anisotropic Filtering = Anisotrope Filterung
Sharper textures at an angle; costs GPU time. = Schärfere Texturen im Winkel; kostet GPU-Zeit.
Anti-Aliasing = Kantenglättung
Smoother edges; costs GPU time. = Glattere Kanten; kostet GPU-Zeit.
Disable Fog = Nebel deaktivieren
Removes distance fog (some games use fog for effects). = Entfernt Entfernungsnebel (manche Spiele nutzen Nebel für Effekte).
Copy Filter = Kopierfilter
The game's own blur/deflicker filter on copies; Off is sharper. = Der eigene Weichzeichner/Flimmerfilter des Spiels bei Kopien; Aus ist schärfer.
EFB Copies = EFB-Kopien
To Texture (fast) = In Textur (schnell)
To RAM (accurate) = In RAM (genau)
Some effects need RAM copies; Texture is faster. = Manche Effekte brauchen RAM-Kopien; Textur ist schneller.
CPU Access to EFB = CPU-Zugriff auf EFB
Needed by some games (lens flares, cursors); Off is faster. = Für manche Spiele nötig (Linsenreflexe, Zeiger); Aus ist schneller.
Manual Texture Sampling = Manuelle Texturabtastung
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Exakte Texturabtastung (behebt manche Videos, z. B. FIFA Street 2); langsamer.
GPU Texture Decoding = Texturdekodierung auf der GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Dekodiert Spieltexturen auf der GPU statt im Video-Thread (hilft in Szenen mit vielen Zeichenaufrufen).
Shader Compilation = Shader-Kompilierung
Asynchronous = Asynchron
Hybrid Ubershaders = Hybride Ubershader
Synchronous = Synchron
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asynchron: kein Ruckeln, Objekte erscheinen eventuell einen Moment später. Hybride Ubershader: kein Ruckeln und nichts fehlt, kostet GPU-Zeit. Synchron: wartet auf jeden neuen Shader.
Emulated CPU Clock = Emulierter CPU-Takt
Auto lowers the clock only when the CPU is the limit. = Automatisch senkt den Takt nur, wenn die CPU die Grenze ist.
Speed Features = Geschwindigkeitsfunktionen
Fast = Schnell
Compatible = Kompatibel
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Kompatibel schaltet die Abkürzungen des Ports im Befehlsstrom ab, wenn ein Spiel Fehler zeigt oder einfriert.
Dual Core = Dual Core
Forced = Erzwungen
Emulates the GPU on its own thread. = Emuliert die GPU in einem eigenen Thread.
Vulkan Thread = Vulkan-Thread
Records graphics commands on a separate core. = Zeichnet Grafikbefehle auf einem eigenen Kern auf.
Fast Disc Speed = Schnelle Disc
Shorter loading pauses (rarely breaks a game). = Kürzere Ladepausen (stört selten ein Spiel).
Performance Graphs = Leistungsgrafiken
Frame time and speed graphs on screen. = Grafiken zu Bildzeit und Geschwindigkeit auf dem Bildschirm.
Language = Sprache
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = Die Sprache der Menüs und, wo GameCube oder Wii sie haben, die der Spiele. Das Menü startet zum Wechseln neu.
Game Volume = Spiellautstärke
Volume of the games' sound. = Lautstärke des Spieltons.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = Was an der Wii Remote steckt. Wii Sports und ähnliche Spiele brauchen Keine.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Für Spiele mit quer gehaltener Wii Remote (NSMB Wii, Mario Kart Wii).
Audio Buffer = Audiopuffer
Larger is smoother when a game runs below full speed; smaller has less delay. = Größer klingt flüssiger, wenn ein Spiel unter voller Geschwindigkeit läuft; kleiner hat weniger Verzögerung.
All Diagnostics = Gesamte Diagnose
Every switch below at once. Off: nothing is recorded while you play. = Alle Schalter darunter auf einmal. Aus: Beim Spielen wird nichts aufgezeichnet.
Performance Log = Leistungsprotokoll
Speed, FPS and hitches every 2 seconds (boot-trace.log). = Geschwindigkeit, FPS und Ruckler alle 2 Sekunden (boot-trace.log).
Freeze Reports = Hängerberichte
Where the emulator was stuck when a game freezes, stalls or starts slowly. = Wo der Emulator stand, wenn ein Spiel einfriert, hängt oder langsam startet.
Emulator Log = Emulatorprotokoll
Dolphin's own messages (dolphin.log). = Dolphins eigene Meldungen (dolphin.log).
Profiler = Profiler
Records where the time goes (samples.log). Costs speed - only for diagnosing slow games. = Zeichnet auf, wofür die Zeit gebraucht wird (samples.log). Kostet Geschwindigkeit - nur zur Analyse langsamer Spiele.
