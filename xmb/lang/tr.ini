Float Rounding = Kayan Nokta Yuvarlama
Accurate = Hassas
Fast skips rounding float math to single precision: up to ~20% faster in float-heavy games (Need for Speed: Most Wanted), but menus or text can go missing (Mario Kart Wii, NFS). Set it for one game at a time; Accurate undoes it. = Hızlı, kayan nokta hesaplarının tek duyarlılığa yuvarlanmasını atlar: yoğun oyunlarda ~%20'ye kadar daha hızlı (Need for Speed: Most Wanted), ama menüler veya yazılar kaybolabilir (Mario Kart Wii, NFS). Oyun oyun ayarlayın; Hassas geri alır.
