Aspect Ratio = En boy oranı
Auto = Otomatik
Stretch = Uzat
The game's picture shape on the TV. = Oyunun TV'deki görüntü şekli.
Letterbox Zoom = Letterbox yakınlaştırma
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = 16:9 görüntüyü bantlarla gösteren oyunlarda 16:9 TV'yi doldurur (Resident Evil 4).
Widescreen Hack = Geniş ekran hilesi
Renders a wider view in 4:3 games (may show glitches at the edges). = 4:3 oyunlarda daha geniş bir görüş verir (kenarlarda hatalar olabilir).
Crop to Aspect Ratio = En boy oranına kırp
Crops the picture to the chosen aspect ratio instead of adding black bars. = Siyah bant eklemek yerine görüntüyü seçilen orana kırpar.
Internal Resolution = Dahili çözünürlük
Native (480p) = Yerel (480p)
Sharper pictures at higher settings; costs GPU time. = Yüksek ayarlarda daha keskin görüntü; GPU kullanır.
Frame Rate Limit = Kare hızı sınırı
Unlimited = Sınırsız
Auto (60/30) = Otomatik (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Saniyede gösterilen kareyi sınırlar. Otomatik: oyun yetiştikçe 60, yetişemezse sabit 30 (dalgalanan kare hızından daha düzgün).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = TV'nin yenilenmesini bekler (yırtılma yok).
FPS Counter = FPS sayacı
Frames and emulation speed in the corner. = Köşede kare sayısı ve emülasyon hızı.
Texture Filtering = Doku filtreleme
Default = Varsayılan
Smooth (linear) = Yumuşak (doğrusal)
Sharp (nearest) = Keskin (en yakın)
How textures are smoothed. = Dokuların nasıl yumuşatılacağı.
Anisotropic Filtering = Anizotropik filtreleme
Sharper textures at an angle; costs GPU time. = Açılı dokular daha keskin; GPU kullanır.
Anti-Aliasing = Kenar yumuşatma
Smoother edges; costs GPU time. = Daha yumuşak kenarlar; GPU kullanır.
Disable Fog = Sisi kapat
Removes distance fog (some games use fog for effects). = Uzaktaki sisi kaldırır (bazı oyunlar sisi efekt için kullanır).
Copy Filter = Kopya filtresi
The game's own blur/deflicker filter on copies; Off is sharper. = Oyunun kopyalardaki kendi bulanıklık/titreme filtresi; Kapalı daha keskindir.
EFB Copies = EFB kopyaları
To Texture (fast) = Dokuya (hızlı)
To RAM (accurate) = RAM'e (doğru)
Some effects need RAM copies; Texture is faster. = Bazı efektler RAM kopyası gerektirir; Doku daha hızlıdır.
CPU Access to EFB = CPU'nun EFB erişimi
Needed by some games (lens flares, cursors); Off is faster. = Bazı oyunlarda gerekir (lens parlamaları, imleçler); Kapalı daha hızlıdır.
Manual Texture Sampling = Elle doku örnekleme
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Tam doku örnekleme (bazı videoları düzeltir, ör. FIFA Street 2); daha yavaş.
GPU Texture Decoding = Dokuları GPU'da çöz
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Oyun dokularını video iş parçacığı yerine GPU'da çözer (yoğun sahnelerde yardımcı olur).
Shader Compilation = Gölgelendirici derleme
Asynchronous = Eşzamansız
Hybrid Ubershaders = Hibrit ubershader
Synchronous = Eşzamanlı
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Eşzamansız: takılma yok, nesneler bir an geç görünebilir. Hibrit ubershader: takılma yok ve eksik yok, GPU kullanır. Eşzamanlı: her yeni gölgelendiriciyi bekler.
Emulated CPU Clock = Emüle edilen CPU saati
Auto lowers the clock only when the CPU is the limit. = Otomatik, saati yalnızca sınır CPU olduğunda düşürür.
Speed Features = Hız özellikleri
Fast = Hızlı
Compatible = Uyumlu
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Uyumlu, bir oyun hata verirse veya donarsa portun komut akışı kısayollarını kapatır.
Dual Core = Çift çekirdek
Forced = Zorunlu
Emulates the GPU on its own thread. = GPU'yu kendi iş parçacığında emüle eder.
Vulkan Thread = Vulkan iş parçacığı
Records graphics commands on a separate core. = Grafik komutlarını ayrı bir çekirdekte kaydeder.
Fast Disc Speed = Hızlı disk
Shorter loading pauses (rarely breaks a game). = Daha kısa yükleme duraklamaları (nadiren oyunu bozar).
Performance Graphs = Performans grafikleri
Frame time and speed graphs on screen. = Ekranda kare süresi ve hız grafikleri.
Language = Dil
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = Menülerin dili ve GameCube ya da Wii destekliyorsa oyunların dili. Değiştirmek için menü yeniden başlar.
Game Volume = Oyun sesi
Volume of the games' sound. = Oyunların ses düzeyi.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = Wii Remote'a ne takılı olduğu. Wii Sports ve benzeri oyunlar Yok ister.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Wii Remote yatay tutularak oynanan oyunlar için (NSMB Wii, Mario Kart Wii).
Audio Buffer = Ses arabelleği
Larger is smoother when a game runs below full speed; smaller has less delay. = Büyük olan, oyun tam hızın altında çalışırken daha akıcıdır; küçük olanın gecikmesi azdır.
All Diagnostics = Tüm tanılama
Every switch below at once. Off: nothing is recorded while you play. = Aşağıdaki tüm anahtarlar birden. Kapalı: oynarken hiçbir şey kaydedilmez.
Performance Log = Performans günlüğü
Speed, FPS and hitches every 2 seconds (boot-trace.log). = Her 2 saniyede hız, FPS ve takılmalar (boot-trace.log).
Freeze Reports = Donma raporları
Where the emulator was stuck when a game freezes, stalls or starts slowly. = Bir oyun donduğunda, takıldığında veya yavaş açıldığında emülatörün nerede olduğu.
Emulator Log = Emülatör günlüğü
Dolphin's own messages (dolphin.log). = Dolphin'in kendi mesajları (dolphin.log).
Profiler = Profil oluşturucu
Records where the time goes (samples.log). Costs speed - only for diagnosing slow games. = Zamanın nereye gittiğini kaydeder (samples.log). Hız kaybettirir - yalnızca yavaş oyunları incelemek için.
