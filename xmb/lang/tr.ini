Rewind = Geri Sar
Goes back to the last checkpoint; press again within a few seconds to go further back (up to 3 minutes). While it is set, a checkpoint is taken every minute of play (a short pause). Cross: press your own. Square: Off. = Son kontrol noktasına döner; daha geriye gitmek için birkaç saniye içinde tekrar basın (3 dakikaya kadar). Atanmışken oyunun her dakikasında bir kontrol noktası alınır (kısa bir duraklama). Çarpı: kendi tuşlarınıza basın. Kare: Kapalı.
Rewinding... = Geri sarılıyor...
Rewound to the last checkpoint = Son kontrol noktasına dönüldü
Rewound to the last checkpoint ({} older: press again) = Son kontrol noktasına dönüldü ({} daha eski: tekrar basın)
No checkpoint yet: the first one is taken after a minute of play = Henüz kontrol noktası yok: ilki bir dakikalık oyundan sonra alınır
No older checkpoint = Daha eski kontrol noktası yok
Rewind failed = Geri sarma başarısız
Hardcore Mode is on: no rewinding. = Hardcore Modu açık: geri sarma yok.
{}: Off = {}: Kapalı
