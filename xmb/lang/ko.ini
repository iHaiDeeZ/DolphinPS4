Anisotropic Filtering = 이방성 필터링
Sharper textures at an angle; costs GPU time. = 비스듬한 텍스처가 선명해집니다. GPU를 사용합니다.
Anti-Aliasing = 안티앨리어싱
Smoother edges; costs GPU time. = 가장자리가 부드러워집니다. GPU를 사용합니다.
Disable Fog = 안개 끄기
Removes distance fog (some games use fog for effects). = 먼 거리의 안개를 없앱니다(효과에 안개를 쓰는 게임도 있습니다).
Copy Filter = 복사 필터
The game's own blur/deflicker filter on copies; Off is sharper. = 복사본에 적용되는 게임 자체의 흐림/깜빡임 방지 필터입니다. 끄면 더 선명합니다.
EFB Copies = EFB 복사
To Texture (fast) = 텍스처로(빠름)
To RAM (accurate) = RAM으로(정확함)
Some effects need RAM copies; Texture is faster. = 일부 효과에는 RAM 복사가 필요합니다. 텍스처가 더 빠릅니다.
CPU Access to EFB = CPU의 EFB 접근
Needed by some games (lens flares, cursors); Off is faster. = 일부 게임에 필요합니다(렌즈 플레어, 커서). 끄면 더 빠릅니다.
Manual Texture Sampling = 수동 텍스처 샘플링
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = 정확한 텍스처 샘플링(FIFA Street 2 등 일부 영상 수정). 더 느립니다.
GPU Texture Decoding = GPU 텍스처 디코딩
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = 게임 텍스처를 비디오 스레드 대신 GPU에서 디코딩합니다(그리기가 많은 장면에 도움).
Shader Compilation = 셰이더 컴파일
Asynchronous = 비동기
Hybrid Ubershaders = 하이브리드 우버셰이더
Synchronous = 동기
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = 비동기: 끊김 없음, 물체가 잠깐 늦게 나타날 수 있습니다. 하이브리드 우버셰이더: 끊김도 누락도 없음, GPU를 사용합니다. 동기: 새 셰이더마다 기다립니다.
Emulated CPU Clock = 에뮬레이션 CPU 클럭
