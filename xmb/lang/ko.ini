Frame Rate Limit = 프레임 레이트 제한
Unlimited = 제한 없음
Auto (60/30) = 자동(60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = 초당 표시하는 프레임 수를 제한합니다. 자동: 게임이 따라오면 60, 못 따라오면 일정한 30(오르내리는 프레임 레이트보다 부드럽습니다).
V-Sync = V-Sync
