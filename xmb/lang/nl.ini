Diagnostics = Diagnose
Aspect Ratio = Beeldverhouding
Auto = Automatisch
Stretch = Uitrekken
The game's picture shape on the TV. = De beeldvorm van het spel op de tv.
Letterbox Zoom = Letterbox-zoom
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Vult een 16:9-tv bij spellen die een 16:9-beeld met balken tonen (Resident Evil 4).
Widescreen Hack = Breedbeeldhack
Renders a wider view in 4:3 games (may show glitches at the edges). = Toont een breder beeld in 4:3-spellen (fouten aan de randen mogelijk).
Crop to Aspect Ratio = Bijsnijden naar beeldverhouding
Crops the picture to the chosen aspect ratio instead of adding black bars. = Snijdt het beeld bij tot de gekozen verhouding in plaats van zwarte balken toe te voegen.
Internal Resolution = Interne resolutie
Native (480p) = Origineel (480p)
Sharper pictures at higher settings; costs GPU time. = Scherper beeld bij hogere waarden; kost GPU-tijd.
Frame Rate Limit = Beeldsnelheidslimiet
Unlimited = Onbeperkt
Auto (60/30) = Automatisch (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Beperkt de getoonde beelden per seconde. Automatisch: 60 zolang het spel het bijhoudt, anders een gelijkmatige 30 (rustiger dan een schommelende beeldsnelheid).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Wacht op de verversing van de tv (geen tearing).
FPS Counter = FPS-teller
Frames and emulation speed in the corner. = Beelden en emulatiesnelheid in de hoek.
Texture Filtering = Textuurfiltering
Default = Standaard
Smooth (linear) = Zacht (lineair)
Sharp (nearest) = Scherp (dichtstbijzijnde)
How textures are smoothed. = Hoe texturen worden afgevlakt.
Anisotropic Filtering = Anisotrope filtering
Sharper textures at an angle; costs GPU time. = Scherpere texturen onder een hoek; kost GPU-tijd.
Anti-Aliasing = Anti-aliasing
Smoother edges; costs GPU time. = Gladdere randen; kost GPU-tijd.
Disable Fog = Mist uitschakelen
Removes distance fog (some games use fog for effects). = Verwijdert afstandsmist (sommige spellen gebruiken mist voor effecten).
Copy Filter = Kopieerfilter
The game's own blur/deflicker filter on copies; Off is sharper. = Het eigen vervagings-/antiflikkerfilter van het spel op kopieën; Uit is scherper.
EFB Copies = EFB-kopieën
To Texture (fast) = Naar textuur (snel)
To RAM (accurate) = Naar RAM (nauwkeurig)
Some effects need RAM copies; Texture is faster. = Sommige effecten hebben RAM-kopieën nodig; Textuur is sneller.
CPU Access to EFB = CPU-toegang tot EFB
Needed by some games (lens flares, cursors); Off is faster. = Nodig voor sommige spellen (lensflares, cursors); Uit is sneller.
Manual Texture Sampling = Handmatige textuurbemonstering
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Exacte textuurbemonstering (verhelpt sommige video's, bv. FIFA Street 2); trager.
GPU Texture Decoding = Textuurdecodering op de GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Decodeert speltexturen op de GPU in plaats van de videothread (helpt bij drukke scènes).
Shader Compilation = Shadercompilatie
Asynchronous = Asynchroon
Hybrid Ubershaders = Hybride ubershaders
Synchronous = Synchroon
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asynchroon: geen haperingen, objecten kunnen een moment later verschijnen. Hybride ubershaders: geen haperingen en niets ontbreekt, kost GPU-tijd. Synchroon: wacht op elke nieuwe shader.
Emulated CPU Clock = Geëmuleerde CPU-klok
Auto lowers the clock only when the CPU is the limit. = Automatisch verlaagt de klok alleen als de CPU de grens is.
Speed Features = Snelheidsfuncties
Fast = Snel
Compatible = Compatibel
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Compatibel schakelt de snelkoppelingen van de port in de opdrachtstroom uit als een spel fouten toont of vastloopt.
Dual Core = Dual Core
Forced = Geforceerd
Emulates the GPU on its own thread. = Emuleert de GPU in een eigen thread.
Vulkan Thread = Vulkan-thread
Records graphics commands on a separate core. = Neemt grafische opdrachten op een aparte kern op.
Fast Disc Speed = Snelle disc
Shorter loading pauses (rarely breaks a game). = Kortere laadpauzes (breekt zelden een spel).
Performance Graphs = Prestatiegrafieken
Frame time and speed graphs on screen. = Grafieken van beeldtijd en snelheid op het scherm.
Language = Taal
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = De taal van de menu's en, waar GameCube of Wii die hebben, die van de spellen. Het menu start opnieuw om te wisselen.
Game Volume = Spelvolume
Volume of the games' sound. = Volume van het geluid van de spellen.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = Wat er op de Wii Remote is aangesloten. Wii Sports en vergelijkbare spellen hebben Geen nodig.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Voor spellen die met de Wii Remote dwars worden gespeeld (NSMB Wii, Mario Kart Wii).
Audio Buffer = Audiobuffer
Larger is smoother when a game runs below full speed; smaller has less delay. = Groter klinkt vloeiender als een spel onder volle snelheid draait; kleiner heeft minder vertraging.
All Diagnostics = Alle diagnose
Every switch below at once. Off: nothing is recorded while you play. = Alle schakelaars hieronder tegelijk. Uit: er wordt niets vastgelegd tijdens het spelen.
Performance Log = Prestatielog
Speed, FPS and hitches every 2 seconds (boot-trace.log). = Snelheid, FPS en haperingen elke 2 seconden (boot-trace.log).
Freeze Reports = Vastloopverslagen
Where the emulator was stuck when a game freezes, stalls or starts slowly. = Waar de emulator was als een spel vastloopt, hapert of traag start.
Emulator Log = Emulatorlog
Dolphin's own messages (dolphin.log). = Dolphins eigen berichten (dolphin.log).
Profiler = Profiler
Records where the time goes (samples.log). Costs speed - only for diagnosing slow games. = Legt vast waar de tijd heen gaat (samples.log). Kost snelheid - alleen om trage spellen te onderzoeken.
