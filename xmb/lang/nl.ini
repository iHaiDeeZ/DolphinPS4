Plays the GameCube's own start-up animation before a game, when its BIOS is on the PS4: /data/DolphinPS4/User/GC/USA/IPL.bin (EUR or JAP for other regions). = Speelt de opstartanimatie van de GameCube vóór een spel, als het BIOS op de PS4 staat: /data/DolphinPS4/User/GC/USA/IPL.bin (EUR of JAP voor andere regio's).
Carousel = Carrousel
Carousel: your covers in a row. = Carrousel: je hoesjes op een rij.
GameCube: a list and a turning cube. = GameCube: een lijst en een draaiende kubus.
Wii: a grid of channels, by page. = Wii: een raster van kanalen, per pagina.
Tabs switch with L1 / R1 (not in XMB). = Tabbladen wisselen met L1 / R1 (niet in XMB).
Float Rounding = Afronding van drijvende komma
Accurate = Nauwkeurig
Fast skips rounding float math to single precision: up to ~20% faster in float-heavy games (Need for Speed: Most Wanted), but menus or text can go missing (Mario Kart Wii, NFS). Set it for one game at a time; Accurate undoes it. = Snel slaat het afronden van drijvendekommaberekeningen naar enkele precisie over: tot ~20% sneller in rekenzware spellen (Need for Speed: Most Wanted), maar menu's of tekst kunnen verdwijnen (Mario Kart Wii, NFS). Stel het per spel in; Nauwkeurig maakt het ongedaan.
Graphics Mods = Grafische mods
No graphics mods for this game. = Geen grafische mods voor dit spel.
Dolphin's own mods cover some games; others go in = Dolphins eigen mods dekken enkele spellen; andere horen in
Rewind = Terugspoelen
Goes back to the last checkpoint; press again within a few seconds to go further back (up to 3 minutes). While it is set, a checkpoint is taken every minute of play (a short pause). Cross: press your own. Square: Off. = Gaat terug naar het laatste controlepunt; druk binnen enkele seconden opnieuw om verder terug te gaan (tot 3 minuten). Zolang dit is ingesteld, wordt elke speelminuut een controlepunt gemaakt (een korte pauze). Kruis: druk je eigen knoppen. Vierkant: Uit.
Rewinding... = Terugspoelen...
Rewound to the last checkpoint = Teruggespoeld naar het laatste controlepunt
Rewound to the last checkpoint ({} older: press again) = Teruggespoeld naar het laatste controlepunt ({} oudere: druk opnieuw)
No checkpoint yet: the first one is taken after a minute of play = Nog geen controlepunt: het eerste komt na een minuut spelen
No older checkpoint = Geen ouder controlepunt
Rewind failed = Terugspoelen mislukt
Hardcore Mode is on: no rewinding. = Hardcore-modus staat aan: niet terugspoelen.
{}: Off = {}: Uit
