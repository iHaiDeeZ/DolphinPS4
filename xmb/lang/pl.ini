Aspect Ratio = Proporcje obrazu
Auto = Automatycznie
Stretch = Rozciągnij
The game's picture shape on the TV. = Kształt obrazu gry na telewizorze.
Letterbox Zoom = Powiększenie letterbox
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Wypełnia telewizor 16:9 w grach z obrazem 16:9 w pasach (Resident Evil 4).
Widescreen Hack = Hack szerokiego ekranu
Renders a wider view in 4:3 games (may show glitches at the edges). = Pokazuje szerszy widok w grach 4:3 (możliwe błędy przy krawędziach).
Crop to Aspect Ratio = Przytnij do proporcji
Crops the picture to the chosen aspect ratio instead of adding black bars. = Przycina obraz do wybranych proporcji zamiast dodawać czarne pasy.
Internal Resolution = Rozdzielczość wewnętrzna
Native (480p) = Natywna (480p)
Sharper pictures at higher settings; costs GPU time. = Ostrzejszy obraz przy wyższych wartościach; obciąża GPU.
Frame Rate Limit = Limit klatek
Unlimited = Bez limitu
Auto (60/30) = Automatycznie (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Ogranicza liczbę klatek na sekundę. Automatycznie: 60, gdy gra nadąża, inaczej równe 30 (stabilniej niż skacząca liczba klatek).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Czeka na odświeżenie telewizora (bez rozrywania obrazu).
FPS Counter = Licznik FPS
Frames and emulation speed in the corner. = Klatki i szybkość emulacji w rogu ekranu.
Texture Filtering = Filtrowanie tekstur
Default = Domyślne
Smooth (linear) = Gładkie (liniowe)
Sharp (nearest) = Ostre (najbliższe)
How textures are smoothed. = Jak wygładzane są tekstury.
Anisotropic Filtering = Filtrowanie anizotropowe
Sharper textures at an angle; costs GPU time. = Ostrzejsze tekstury pod kątem; obciąża GPU.
Anti-Aliasing = Antyaliasing
Smoother edges; costs GPU time. = Gładsze krawędzie; obciąża GPU.
Disable Fog = Wyłącz mgłę
Removes distance fog (some games use fog for effects). = Usuwa mgłę w oddali (niektóre gry używają jej do efektów).
Copy Filter = Filtr kopii
The game's own blur/deflicker filter on copies; Off is sharper. = Własny filtr rozmycia/migotania gry na kopiach; Wył. jest ostrzejsze.
EFB Copies = Kopie EFB
To Texture (fast) = Do tekstury (szybko)
To RAM (accurate) = Do RAM (dokładnie)
Some effects need RAM copies; Texture is faster. = Niektóre efekty wymagają kopii w RAM; Tekstura jest szybsza.
CPU Access to EFB = Dostęp CPU do EFB
Needed by some games (lens flares, cursors); Off is faster. = Potrzebny w niektórych grach (bliki, kursory); Wył. jest szybsze.
Manual Texture Sampling = Ręczne próbkowanie tekstur
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Dokładne próbkowanie tekstur (naprawia niektóre filmy, np. FIFA Street 2); wolniejsze.
GPU Texture Decoding = Dekodowanie tekstur na GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Dekoduje tekstury gry na GPU zamiast w wątku wideo (pomaga w ciężkich scenach).
Shader Compilation = Kompilacja shaderów
Asynchronous = Asynchroniczna
Hybrid Ubershaders = Hybrydowe ubershadery
Synchronous = Synchroniczna
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asynchroniczna: bez przycięć, obiekty mogą pojawić się chwilę później. Hybrydowe ubershadery: bez przycięć i niczego nie brakuje, obciąża GPU. Synchroniczna: czeka na każdy nowy shader.
Emulated CPU Clock = Zegar emulowanego CPU
Auto lowers the clock only when the CPU is the limit. = Automatycznie obniża zegar tylko wtedy, gdy ograniczeniem jest CPU.
Speed Features = Funkcje szybkości
Fast = Szybkie
Compatible = Zgodne
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Zgodne wyłącza skróty portu w strumieniu poleceń, jeśli gra ma błędy lub się zawiesza.
Dual Core = Dwa rdzenie
Forced = Wymuszone
Emulates the GPU on its own thread. = Emuluje GPU we własnym wątku.
Vulkan Thread = Wątek Vulkan
Records graphics commands on a separate core. = Nagrywa polecenia grafiki na osobnym rdzeniu.
Fast Disc Speed = Szybki dysk
Shorter loading pauses (rarely breaks a game). = Krótsze przerwy na wczytywanie (rzadko psuje grę).
Performance Graphs = Wykresy wydajności
Frame time and speed graphs on screen. = Wykresy czasu klatki i szybkości na ekranie.
Language = Język
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = Język menu oraz, jeśli GameCube lub Wii go mają, język gier. Menu uruchamia się ponownie, aby go zmienić.
Game Volume = Głośność gry
Volume of the games' sound. = Głośność dźwięku gier.
What is plugged into the Wii Remote. Wii Sports and similar games need None. = Co jest podłączone do Wii Remote. Wii Sports i podobne gry wymagają opcji Brak.
For games played with the Wii Remote held sideways (NSMB Wii, Mario Kart Wii). = Do gier, w które gra się z Wii Remote trzymanym poziomo (NSMB Wii, Mario Kart Wii).
Audio Buffer = Bufor dźwięku
