Aspect Ratio = Rapporto d'aspetto
Auto = Automatico
Stretch = Estendi
The game's picture shape on the TV. = La forma dell'immagine del gioco sulla TV.
Letterbox Zoom = Zoom letterbox
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Riempie una TV 16:9 con i giochi che mostrano un'immagine 16:9 con bande (Resident Evil 4).
Widescreen Hack = Hack widescreen
Renders a wider view in 4:3 games (may show glitches at the edges). = Mostra una visuale più ampia nei giochi 4:3 (possibili difetti ai bordi).
Crop to Aspect Ratio = Ritaglia al rapporto d'aspetto
Crops the picture to the chosen aspect ratio instead of adding black bars. = Ritaglia l'immagine al rapporto scelto invece di aggiungere bande nere.
Internal Resolution = Risoluzione interna
Native (480p) = Nativa (480p)
Sharper pictures at higher settings; costs GPU time. = Immagine più nitida con valori alti; usa la GPU.
Frame Rate Limit = Limite fotogrammi
Unlimited = Nessun limite
Auto (60/30) = Automatico (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Limita i fotogrammi mostrati al secondo. Automatico: 60 finché il gioco regge, 30 costanti altrimenti (più stabile di una frequenza che oscilla).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Attende l'aggiornamento della TV (nessuno strappo).
FPS Counter = Contatore FPS
Frames and emulation speed in the corner. = Fotogrammi e velocità di emulazione nell'angolo.
Texture Filtering = Filtro texture
Default = Predefinito
Smooth (linear) = Morbido (lineare)
Sharp (nearest) = Nitido (più vicino)
How textures are smoothed. = Come vengono smussate le texture.
Anisotropic Filtering = Filtro anisotropico
Sharper textures at an angle; costs GPU time. = Texture più nitide in obliquo; usa la GPU.
Anti-Aliasing = Anti-aliasing
Smoother edges; costs GPU time. = Bordi più morbidi; usa la GPU.
Disable Fog = Disattiva nebbia
Removes distance fog (some games use fog for effects). = Rimuove la nebbia in lontananza (alcuni giochi la usano per effetti).
Copy Filter = Filtro di copia
The game's own blur/deflicker filter on copies; Off is sharper. = Il filtro di sfocatura/anti-sfarfallio del gioco sulle copie; No è più nitido.
EFB Copies = Copie EFB
To Texture (fast) = Su texture (veloce)
To RAM (accurate) = Su RAM (preciso)
Some effects need RAM copies; Texture is faster. = Alcuni effetti richiedono copie in RAM; Texture è più veloce.
CPU Access to EFB = Accesso CPU all'EFB
Needed by some games (lens flares, cursors); Off is faster. = Necessario per alcuni giochi (riflessi, cursori); No è più veloce.
Manual Texture Sampling = Campionamento manuale texture
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Campionamento esatto delle texture (corregge alcuni video, es. FIFA Street 2); più lento.
GPU Texture Decoding = Decodifica texture su GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Decodifica le texture del gioco sulla GPU invece che nel thread video (aiuta nelle scene molto pesanti).
Shader Compilation = Compilazione shader
Asynchronous = Asincrona
Hybrid Ubershaders = Ubershader ibridi
Synchronous = Sincrona
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asincrona: niente scatti, gli oggetti possono apparire con un attimo di ritardo. Ubershader ibridi: niente scatti e non manca nulla, usa la GPU. Sincrona: attende ogni nuovo shader.
Emulated CPU Clock = Clock CPU emulata
Auto lowers the clock only when the CPU is the limit. = Automatico abbassa il clock solo quando la CPU è il limite.
Speed Features = Funzioni di velocità
Fast = Veloce
Compatible = Compatibile
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Compatibile disattiva le scorciatoie del port sul flusso di comandi se un gioco ha problemi o si blocca.
Dual Core = Dual Core
Forced = Forzato
Emulates the GPU on its own thread. = Emula la GPU in un thread separato.
Vulkan Thread = Thread Vulkan
Records graphics commands on a separate core. = Registra i comandi grafici su un altro core.
Fast Disc Speed = Disco veloce
Shorter loading pauses (rarely breaks a game). = Pause di caricamento più brevi (raramente crea problemi).
Performance Graphs = Grafici delle prestazioni
Frame time and speed graphs on screen. = Grafici del tempo per fotogramma e della velocità a schermo.
Language = Lingua
The menus' language, and the games' own language where the GameCube or Wii has it. The menu restarts to change it. = La lingua dei menu e, dove GameCube o Wii la hanno, quella dei giochi. Il menu si riavvia per cambiarla.
Game Volume = Volume del gioco
Volume of the games' sound. = Volume dell'audio dei giochi.
