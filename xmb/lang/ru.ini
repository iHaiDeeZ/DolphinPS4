Frame Rate Limit = Ограничение кадров
Unlimited = Без ограничения
Auto (60/30) = Авто (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Ограничивает число кадров в секунду. Авто: 60, пока игра успевает, иначе ровные 30 (стабильнее скачущей частоты кадров).
V-Sync = V-Sync
