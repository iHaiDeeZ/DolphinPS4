The game's picture shape on the TV. = Форма изображения игры на телевизоре.
Letterbox Zoom = Масштаб letterbox
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Заполняет телевизор 16:9 в играх с изображением 16:9 в полосах (Resident Evil 4).
Widescreen Hack = Широкоэкранный хак
Renders a wider view in 4:3 games (may show glitches at the edges). = Показывает более широкий вид в играх 4:3 (возможны ошибки по краям).
Crop to Aspect Ratio = Обрезать по соотношению
