Dual Core = Двухъядерный режим
Forced = Принудительно
Emulates the GPU on its own thread. = Эмулирует GPU в отдельном потоке.
Vulkan Thread = Поток Vulkan
Records graphics commands on a separate core. = Записывает графические команды на отдельном ядре.
Fast Disc Speed = Быстрый диск
Shorter loading pauses (rarely breaks a game). = Короче паузы загрузки (редко ломает игру).
