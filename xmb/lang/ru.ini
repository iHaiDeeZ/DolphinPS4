Default = По умолчанию
Smooth (linear) = Сглаженная (линейная)
Sharp (nearest) = Чёткая (ближайшая)
How textures are smoothed. = Как сглаживаются текстуры.
Anisotropic Filtering = Анизотропная фильтрация
Sharper textures at an angle; costs GPU time. = Чётче текстуры под углом; нагружает GPU.
Anti-Aliasing = Сглаживание
Smoother edges; costs GPU time. = Более гладкие края; нагружает GPU.
Disable Fog = Отключить туман
Removes distance fog (some games use fog for effects). = Убирает дальний туман (некоторые игры используют его для эффектов).
Copy Filter = Фильтр копий
The game's own blur/deflicker filter on copies; Off is sharper. = Собственный фильтр размытия/мерцания игры на копиях; Выкл. чётче.
EFB Copies = Копии EFB
To Texture (fast) = В текстуру (быстро)
To RAM (accurate) = В RAM (точно)
Some effects need RAM copies; Texture is faster. = Некоторым эффектам нужны копии в RAM; Текстура быстрее.
CPU Access to EFB = Доступ CPU к EFB
Needed by some games (lens flares, cursors); Off is faster. = Нужен некоторым играм (блики, курсоры); Выкл. быстрее.
Manual Texture Sampling = Ручная выборка текстур
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Точная выборка текстур (исправляет некоторые видео, напр. FIFA Street 2); медленнее.
GPU Texture Decoding = Декодирование текстур на GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Декодирует текстуры игры на GPU вместо видеопотока (помогает в тяжёлых сценах).
Shader Compilation = Компиляция шейдеров
Asynchronous = Асинхронная
Hybrid Ubershaders = Гибридные убершейдеры
Synchronous = Синхронная
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Асинхронная: без подтормаживаний, объекты могут появиться чуть позже. Гибридные убершейдеры: без подтормаживаний и ничего не пропадает, нагружает GPU. Синхронная: ждёт каждый новый шейдер.
Emulated CPU Clock = Частота эмулируемого CPU
Auto lowers the clock only when the CPU is the limit. = Авто снижает частоту только тогда, когда ограничивает CPU.
Speed Features = Функции скорости
Fast = Быстро
Compatible = Совместимо
