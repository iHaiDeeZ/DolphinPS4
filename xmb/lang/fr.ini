Aspect Ratio = Format d'image
Auto = Auto
Stretch = Étirer
The game's picture shape on the TV. = La forme de l'image du jeu sur la TV.
Letterbox Zoom = Zoom letterbox
Fills a 16:9 TV with games that letterbox a 16:9 picture (Resident Evil 4). = Remplit une TV 16:9 avec les jeux qui affichent une image 16:9 avec des bandes (Resident Evil 4).
Widescreen Hack = Hack écran large
Renders a wider view in 4:3 games (may show glitches at the edges). = Affiche une vue plus large dans les jeux 4:3 (des défauts peuvent apparaître sur les bords).
Crop to Aspect Ratio = Recadrer au format
Crops the picture to the chosen aspect ratio instead of adding black bars. = Recadre l'image au format choisi au lieu d'ajouter des bandes noires.
Internal Resolution = Résolution interne
Native (480p) = Native (480p)
Sharper pictures at higher settings; costs GPU time. = Image plus nette avec des valeurs élevées ; utilise le GPU.
Frame Rate Limit = Limite d'images
Unlimited = Illimitée
Auto (60/30) = Auto (60/30)
Caps the frames shown per second. Auto: 60 while the game keeps up, an even 30 when it can't (steadier than a frame rate that bounces around). = Limite les images affichées par seconde. Auto : 60 tant que le jeu suit, un 30 régulier sinon (plus stable qu'une cadence qui varie).
V-Sync = V-Sync
Waits for the TV's refresh (no tearing). = Attend le rafraîchissement de la TV (pas de déchirement).
FPS Counter = Compteur de FPS
Frames and emulation speed in the corner. = Images et vitesse d'émulation dans le coin.
Texture Filtering = Filtrage des textures
Default = Par défaut
Smooth (linear) = Lisse (linéaire)
Sharp (nearest) = Net (plus proche)
How textures are smoothed. = Comment les textures sont lissées.
Anisotropic Filtering = Filtrage anisotrope
Sharper textures at an angle; costs GPU time. = Textures plus nettes en biais ; utilise le GPU.
Anti-Aliasing = Anticrénelage
Smoother edges; costs GPU time. = Contours plus lisses ; utilise le GPU.
Disable Fog = Désactiver le brouillard
Removes distance fog (some games use fog for effects). = Supprime le brouillard lointain (certains jeux s'en servent pour des effets).
Copy Filter = Filtre de copie
The game's own blur/deflicker filter on copies; Off is sharper. = Le filtre de flou/anti-scintillement du jeu sur les copies ; Non est plus net.
EFB Copies = Copies EFB
To Texture (fast) = Vers texture (rapide)
To RAM (accurate) = Vers RAM (précis)
Some effects need RAM copies; Texture is faster. = Certains effets ont besoin de copies en RAM ; Texture est plus rapide.
CPU Access to EFB = Accès CPU à l'EFB
Needed by some games (lens flares, cursors); Off is faster. = Nécessaire pour certains jeux (reflets d'objectif, curseurs) ; Non est plus rapide.
Manual Texture Sampling = Échantillonnage manuel des textures
Exact texture sampling (fixes some videos, e.g. FIFA Street 2); slower. = Échantillonnage exact des textures (corrige certaines vidéos, p. ex. FIFA Street 2) ; plus lent.
GPU Texture Decoding = Décodage des textures par le GPU
Decodes game textures on the GPU instead of the video thread (helps draw-heavy scenes). = Décode les textures du jeu sur le GPU plutôt que sur le thread vidéo (aide dans les scènes chargées).
Shader Compilation = Compilation des shaders
Asynchronous = Asynchrone
Hybrid Ubershaders = Ubershaders hybrides
Synchronous = Synchrone
Asynchronous: no stutter, objects may appear a moment late. Hybrid Ubershaders: no stutter and nothing missing, costs GPU time. Synchronous: waits for each new shader. = Asynchrone : pas de saccades, des objets peuvent apparaître un instant en retard. Ubershaders hybrides : pas de saccades et rien ne manque, utilise le GPU. Synchrone : attend chaque nouveau shader.
Emulated CPU Clock = Horloge du CPU émulé
Auto lowers the clock only when the CPU is the limit. = Auto baisse l'horloge seulement quand le CPU est la limite.
Speed Features = Fonctions de vitesse
Fast = Rapide
Compatible = Compatible
Compatible turns off the port's command-stream shortcuts if a game glitches or freezes. = Compatible désactive les raccourcis du port sur le flux de commandes si un jeu bugue ou se fige.
Dual Core = Double cœur
Forced = Forcé
Emulates the GPU on its own thread. = Émule le GPU sur son propre thread.
Vulkan Thread = Thread Vulkan
Records graphics commands on a separate core. = Enregistre les commandes graphiques sur un autre cœur.
Fast Disc Speed = Disque rapide
Shorter loading pauses (rarely breaks a game). = Pauses de chargement plus courtes (casse rarement un jeu).
