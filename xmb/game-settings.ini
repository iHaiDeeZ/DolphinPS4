# Dolphin for PS4 - game settings center
#
# The best settings found for each game on a PS4, applied when that game starts. The app fetches
# this file from GitHub at every start (when online) and keeps a copy in
# /data/DolphinPS4/game-settings.ini; the package carries this version for offline use.
#
# Only [GAME ID] sections are read (6 characters: that disc; 3 characters: every region). Order of
# priority: the app's defaults < this file < /data/DolphinPS4/ps4.ini < the menu's own settings.
# Every game here runs with diagnostics off (logs, freeze reports and the profiler cost speed).
# Tested on a base PS4 (1.6 GHz) unless a comment says otherwise.

# --- GameCube ---------------------------------------------------------------------------------

[GCBE7D]
# Crash Bandicoot: The Wrath of Cortex - its performance counters aren't needed (~2% faster).
perfmon=off
diagnostics_all=off

[GUP]
# Shadow the Hedgehog - Dolphin forces single core for it; dual core is twice as fast here.
dual_core=force
diagnostics_all=off

[G4B]
# Resident Evil 4 - fill the TV with its letterboxed picture.
zoom=letterbox
diagnostics_all=off

[GFY]
# FIFA Street 2 - EA's VP6 videos need exact texture sampling; one of the command-stream
# shortcuts drops menu items. sync_on_idle=off made it run too fast and flicker: keep it on.
manual_texture_sampling=on
tex_hash_once=on
fifo_defer=off
jit_gp_fuse=off
jit_lazy_lfs=off
cpu_clock=100
diagnostics_all=off

[GAL]
# Super Smash Bros. Melee - busy matches are CPU-bound; below 40% the game itself drops frames
# (30%: ~25 FPS, 35%: ~46, 40% and up: ~60), above it the emulator falls behind.
cpu_clock_min=40
diagnostics_all=off

[GK2]
# Spider-Man 2 - the deferred FIFO flushes broke it; they switch off by themselves for games
# that need MMU emulation, and the other shortcuts are fine: 30 FPS most of the time.
speed_mode=fast
diagnostics_all=off

[G9R]
# Crash Tag Team Racing - with the command-stream shortcuts the GPU FIFO broke ("Unknown
# Opcode") and the game froze ~30 s in.
jit_lazy_lfs=off
fifo_defer=off
jit_gp_fuse=off
fifo_batch=off
diagnostics_all=off

[GYR]
# TMNT (2007) - the specialized shaders draw the jungle blue/purple on PS4 (brown on PC); the
# ubershaders get it right, and reading vertices the usual way keeps them at full speed (25 FPS,
# the PAL rate, at 100%). Exact texture sampling removes thin lines across the cutscenes; 2x keeps
# the GPU at ~50%. Needs Dolphin v03.51 / Dolphin Lab v50.09 or later.
shader_compile=uber
vk_dynamic_vertex_loader=off
manual_texture_sampling=on
resolution=2
diagnostics_all=off

[GM8]
# Metroid Prime - the deferred FIFO flushes broke the GPU command stream (Unknown Opcode ~90 s
# in, then nothing drawn); the other shortcuts are fine. CPU culling (on in Dolphin's own INI)
# spends the busy video thread to spare the idle GPU: off (Dolphin Lab v50.14+). The auto clock
# may go down to 40%: 96% speed on average, ~48 FPS (base PS4).
fifo_defer=off
cpu_cull=off
cpu_clock_min=40
diagnostics_all=off

[GHC]
# Chicken Little - Bink video cutscenes came out garbled: the video thread's per-frame texture
# hash memo missed the video texture being rewritten within a frame. Hashing every lookup fixes it.
tex_hash_once=off
diagnostics_all=off

[GOW]
# Need for Speed: Most Wanted - CPU-bound; its hottest code is paired-single 3D maths. Without
# the single-precision rounding: gameplay +21% FPS at the same clock (21.5 -> 26), 22-40 FPS,
# no visual differences seen (base PS4).
jit_accurate_singles=off
diagnostics_all=off

# --- Wii --------------------------------------------------------------------------------------

[RQJ]
# Crash of the Titans - the deferred FIFO flushes broke it (black screen, looping sound); the
# other shortcuts are fine. The CPU thread waited ~19% of its time for the video thread at each
# idle: without that sync the emulation runs at 100% and the auto clock settles ~50% instead of
# the 30% floor (v03.43, no flicker seen).
speed_mode=fast
fifo_defer=off
sync_on_idle=off
cpu_clock_min=30
diagnostics_all=off

[SM8]
# Call of Duty: Modern Warfare 3 - froze ~45 s into the first level (its GX FIFO breakpoint went
# wrong: "GFX FIFO: Unknown Opcode" or a FIFO timeout) with the deferred FIFO flushes; off fixes
# it. Gameplay is CPU-bound: the auto clock may go down to 40% (~62% speed, 12-25 FPS, base PS4).
fifo_defer=off
cpu_clock_min=40
diagnostics_all=off

[RB7]
# Bully: Scholarship Edition - busy scenes are CPU-bound: the auto clock may go down to 35% (busy
# scenes ~88% -> ~95% speed; 30% stops it at boot).
cpu_clock_min=35
diagnostics_all=off

[RSP]
# Wii Sports - Wii Remote alone (a Nunchuk makes it ask to remove it); CPU-bound, the auto clock
# may go down to 30%.
wii_extension=none
cpu_clock_min=30
diagnostics_all=off

[RZT]
# Wii Sports Resort - Wii Remote alone; CPU-bound (85-98% busy at 50%), clock may go down to 30%.
wii_extension=none
cpu_clock_min=30
diagnostics_all=off

[RHA]
# Wii Play - Wii Remote alone.
wii_extension=none
diagnostics_all=off

[SMN]
# New Super Mario Bros. Wii - Wii Remote held sideways.
wii_extension=none
wii_sideways=on
diagnostics_all=off

[RMC]
# Mario Kart Wii - Wii Remote held sideways. Frames are shown from their own thread: the PS4's
# submit-and-flip call waited for the GPU ~40% of the time on the video thread (~63% -> ~75%
# speed in races, Dolphin v04.01 / Dolphin Lab v50.44 or later). CPU-bound in busy races: the
# auto clock may go down to 40%.
wii_extension=none
wii_sideways=on
flip_thread=on
display_buffers=6
cpu_clock_min=40
diagnostics_all=off

[SUK]
# Kirby's Return to Dream Land - Wii Remote held sideways.
wii_extension=none
wii_sideways=on
diagnostics_all=off

[RSB]
# Super Smash Bros. Brawl - Wii Remote held sideways.
wii_extension=none
wii_sideways=on
diagnostics_all=off
