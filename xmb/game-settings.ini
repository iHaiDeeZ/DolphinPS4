# Dolphin for PS4 - game settings center
#
# The best settings found for each game on a PS4, applied when that game starts. The app fetches
# this file from GitHub at every start (when online) and keeps a copy in
# /data/DolphinPS4/game-settings.ini; the package carries this version for offline use.
#
# Only [GAME ID] sections are read (6 characters: that disc; 3 characters: every region). Order of
# priority: the app's defaults < this file < /data/DolphinPS4/ps4.ini < the menu's own settings.
# Tested on a base PS4 (1.6 GHz) unless a comment says otherwise.

# --- GameCube ---------------------------------------------------------------------------------

[GCBE7D]
# Crash Bandicoot: The Wrath of Cortex - its performance counters aren't needed (~2% faster).
perfmon=off

[GUP]
# Shadow the Hedgehog - Dolphin forces single core for it; dual core is twice as fast here.
dual_core=force

[G4B]
# Resident Evil 4 - fill the TV with its letterboxed picture.
zoom=letterbox

[GFY]
# FIFA Street 2 - EA's VP6 videos need exact texture sampling; one of the command-stream
# shortcuts drops menu items. sync_on_idle=off made it run too fast and flicker: keep it on.
manual_texture_sampling=on
tex_hash_once=on
fifo_defer=off
jit_gp_fuse=off
jit_lazy_lfs=off
cpu_clock=100

[GAL]
# Super Smash Bros. Melee - busy matches are CPU-bound; below 40% the game itself drops frames
# (30%: ~25 FPS, 35%: ~46, 40% and up: ~60), above it the emulator falls behind.
cpu_clock_min=40

[GK2]
# Spider-Man 2 - the deferred FIFO flushes broke it; they switch off by themselves for games
# that need MMU emulation, and the other shortcuts are fine: 30 FPS most of the time.
speed_mode=fast

[G9R]
# Crash Tag Team Racing - with the command-stream shortcuts the GPU FIFO broke ("Unknown
# Opcode") and the game froze ~30 s in.
jit_lazy_lfs=off
fifo_defer=off
jit_gp_fuse=off
fifo_batch=off

# --- Wii --------------------------------------------------------------------------------------

[RQJ]
# Crash of the Titans - the deferred FIFO flushes broke it (black screen, looping sound); the
# other shortcuts are fine. The CPU thread waited ~19% of its time for the video thread at each
# idle: without that sync the emulation runs at 100% and the auto clock settles ~50% instead of
# the 30% floor (v03.43, no flicker seen).
speed_mode=fast
fifo_defer=off
sync_on_idle=off
cpu_clock_min=30

[RB7]
# Bully: Scholarship Edition - busy scenes are CPU-bound at the 50% floor: the auto clock may go
# down to 40%.
cpu_clock_min=40

[RSP]
# Wii Sports - Wii Remote alone (a Nunchuk makes it ask to remove it); CPU-bound, the auto clock
# may go down to 30%.
wii_extension=none
cpu_clock_min=30

[RZT]
# Wii Sports Resort - Wii Remote alone; CPU-bound (85-98% busy at 50%), clock may go down to 30%.
wii_extension=none
cpu_clock_min=30

[RHA]
# Wii Play - Wii Remote alone.
wii_extension=none

[SMN]
# New Super Mario Bros. Wii - Wii Remote held sideways.
wii_extension=none
wii_sideways=on

[RMC]
# Mario Kart Wii - Wii Remote held sideways.
wii_extension=none
wii_sideways=on

[SUK]
# Kirby's Return to Dream Land - Wii Remote held sideways.
wii_extension=none
wii_sideways=on

[RSB]
# Super Smash Bros. Brawl - Wii Remote held sideways.
wii_extension=none
wii_sideways=on
